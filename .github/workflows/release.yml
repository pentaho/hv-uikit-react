name: Release

on:
  schedule:
    - cron: "0 5 1,15 * *" # at 05:00 on day 1 and 15 of every month
  workflow_dispatch:
    inputs:
      mode:
        description: |
          default      version from conventional commits, then publish
          graduate     take packages off the prerelease line (7.0.0-next.3 -> 7.0.0)
          from-package publish the versions already committed, without bumping
        type: choice
        options: [default, graduate, from-package]
        default: default

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  visual-tests:
    name: Visual Tests
    uses: ./.github/workflows/tests-visual.yml
    secrets: inherit

  publish:
    name: Publish Packages
    needs: [tests, visual-tests]
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHECKOUT_REF: ${{ github.event.client_payload.ref }}
      RELEASE_TYPE: ${{ github.event.client_payload.type }}
      NPM_CONFIG_PROVENANCE: true

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Pulls all commits (needed for semantic release to correctly version)
          # See https://github.com/semantic-release/semantic-release/issues/1526
          fetch-depth: "0"
          fetch-tags: true

      - name: Publish Setup
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check for package changes
        run: npx lerna changed

      - name: Set CURRENT_VERSION
        run: |
          VERSION=v$(npm pkg get version --ws | sed -n 's/.*uikit-react-core": "\(.*\)".*/\1/p')
          echo "CURRENT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish to NPM
        id: publish-npm
        run: |
          case "${{ github.event.inputs.mode || 'default' }}" in
            graduate)
              npx lerna publish --conventional-commits --conventional-graduate --yes
              ;;
            from-package)
              npx lerna publish from-package --yes
              ;;
            *)
              npm run publish
              ;;
          esac
        env:
          HUSKY: 0

      - name: Set NEW_VERSION
        id: version
        # Outputs the NEW_VERSION if there is one, or exits otherwise
        # We only tag+publish+notify if there a new core package version
        run: |
          VERSION=v$(npm pkg get version --ws | sed -n 's/.*uikit-react-core": "\(.*\)".*/\1/p')
          if [ "$CURRENT_VERSION" = "$VERSION" ] && [ "${{ github.event.inputs.mode || 'default' }}" != "from-package" ]; then
            echo "No new uikit-react-core version to release. Exiting"
            exit 1
          fi
          echo "NEW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify the publish
        run: |
          PKG=$(npm pkg get name -w packages/core | sed -n 's/.*"\(@[^"]*\)".*/\1/p' | head -1)
          npm view "$PKG@${NEW_VERSION#v}" version
          echo "Published $PKG@${NEW_VERSION#v}"

      - name: Tag Release
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$NEW_VERSION"; then
            echo "Tag $NEW_VERSION already exists, skipping"
          else
            git tag -a "$NEW_VERSION" -m "Version $NEW_VERSION"
            git push origin "$NEW_VERSION"
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm i --no-save changelogithub@0.13
          npx changelogithub --from $CURRENT_VERSION --to $NEW_VERSION

  publish-documentation:
    name: Publish Documentation
    needs: [publish]
    uses: ./.github/workflows/documentation.yml
    secrets: inherit
    with:
      publish-folder: ${{ github.ref_name }}
