name: Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Format
        run: npm run prettier

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: License Check
        run: npx license-compliance

      - name: Security Audit
        run: npm audit --workspaces --omit dev --audit-level critical

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Test
        run: npm run test

  node:
    # the packages that run on Node, on the latest of each LTS line: uikit-tools needs 22.12+, uikit-cli 22.22+, 24.15+
    # or 26+, and installing the repo 22.18+ (its icons scripts are .ts), so the floors themselves are not run here
    name: Node ${{ matrix.node }} (tools, CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        # every package: the CLI's tests build an app from each template against them
        run: npm run build

      - name: Test uikit-tools
        # unit and integration tests, the same on every Node: the e2e below is what varies
        if: matrix.node == '26.x'
        run: npm run test -w packages/tools -- --run

      - name: Test uikit-tools outside the repo
        run: npm run test:e2e -w packages/tools

      - name: Test uikit-cli
        if: matrix.node == '26.x'
        run: npm run test -w packages/cli -- --run

      - name: Test the templates' apps
        # a full build and check of each template's app, the same on every Node
        if: matrix.node == '26.x'
        run: npm run test:apps -w packages/cli

      - name: Test the published types
        # a TypeScript check, the same on every Node
        if: matrix.node == '26.x'
        run: npm run test:types

  storybook:
    # storybook runs a11y and component tests
    name: Storybook Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Playwright
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build dependent packages
        run: npm run build -w packages/uno-preset -w packages/styles

      - name: Run Tests
        run: npm run test:storybook -- --no-file-parallelism ${{ github.head_ref && '--changed=origin/master' || '' }} --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  figma:
    # the Figma library from code (packages/figma): the sync file and the Code Connect templates stay current; with a
    # FIGMA_TOKEN secret (callers that pass secrets), the library is compared read-only and component properties are
    # checked for drift. Only those steps see the token. CI never publishes Code Connect (see packages/figma/README.md).
    name: Figma Library Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        # the theme's tokens and the components' metadata it reads, then the plugin (a private package, which lerna
        # leaves out)
        run: |
          npx lerna run build --scope @pentaho/uikit-styles --scope @pentaho/uikit-react-core --include-dependencies
          npm run build -w packages/figma

      - name: Test
        run: npm run test -w packages/figma -- --run

      - name: Check the generated files are current
        run: npm run generate -w packages/figma -- --check

      - name: Parse the Code Connect templates
        working-directory: packages/figma
        run: npx --no-install figma connect parse > /dev/null

      - name: Compare the library with the code (read-only)
        if: env.HAS_FIGMA_TOKEN == 'true'
        working-directory: packages/figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          npm run compare
          npm run capture
          git diff --exit-code code-connect/properties.json

  build:
    name: Build
    uses: ./.github/workflows/build.yml
