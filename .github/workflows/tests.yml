name: Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Format
        run: npm run prettier

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: License Check
        run: npx license-compliance

      - name: Security Audit
        run: npm audit --workspaces --omit dev --audit-level critical

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Test
        run: npm run test

  node:
    # the packages that run on Node, on every supported LTS line (engines: >=22.12.0)
    name: Node ${{ matrix.node }} (tools, CLI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        run: npm run build -w packages/styles -w packages/utils -w packages/shared -w packages/core -w packages/tools

      - name: Test uikit-tools
        run: npm run test -w packages/tools -- --run

      - name: Test uikit-tools outside the repo
        run: npm run test:e2e -w packages/tools

      - name: Test the published types
        # a TypeScript check, the same on every Node
        if: matrix.node == '26.x'
        run: npm run test:types

  storybook:
    # storybook runs a11y and component tests
    name: Storybook Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Playwright
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build dependent packages
        run: npm run build -w packages/uno-preset -w packages/styles

      - name: Run Tests
        run: npm run test:storybook -- --no-file-parallelism ${{ github.head_ref && '--changed=origin/master' || '' }} --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build:
    name: Build
    uses: ./.github/workflows/build.yml
