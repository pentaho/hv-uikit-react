<!-- The plugin's panel, for whoever maintains the library: load figma-sync.json (it previews at once), apply, render
     the pages. The report as the plugin sends it. Figma's theme colors, no network. -->
<style>
  body {
    margin: 0;
    padding: 12px;
    font:
      12px Inter,
      sans-serif;
    color: var(--figma-color-text);
    background: var(--figma-color-bg);
    overflow-wrap: anywhere;
  }
  button {
    margin: 8px 8px 0 0;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--figma-color-border);
    background: var(--figma-color-bg-secondary);
    color: var(--figma-color-text);
  }
  button:disabled {
    opacity: 0.5;
  }
  button.primary {
    background: var(--figma-color-bg-brand);
    color: var(--figma-color-text-onbrand);
    border: 0;
  }
  #out {
    margin-top: 12px;
    max-height: 360px;
    overflow: auto;
  }
  details {
    margin-bottom: 8px;
  }
  summary {
    cursor: pointer;
    font-weight: 600;
  }
  details.decide summary {
    color: var(--figma-color-text-warning);
  }
  ul {
    margin: 4px 0 0;
    padding-left: 16px;
  }
  button.link {
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    color: var(--figma-color-text-brand);
    text-align: left;
    cursor: pointer;
  }
  .headline {
    font-weight: 600;
  }
  .note {
    color: var(--figma-color-text-secondary);
  }
  .error {
    color: var(--figma-color-text-danger);
  }
</style>
<p>
  Keeps this library in step with the code. Load the
  <code>figma-sync.json</code> from <code>packages/figma</code>: it previews at
  once, and nothing changes until you apply. Render pages draws the
  documentation pages this build carries.
</p>
<input type="file" id="file" accept=".json" />
<div>
  <button id="apply" class="primary" disabled>Apply</button>
  <button id="pages">Render pages</button>
  <button id="preview">Preview again</button>
</div>
<div id="out"><p class="note">No file loaded.</p></div>
<script>
  // Renders what the plugin answers (src/report.ts): a headline, then each section, those to decide first. An item
  // with a node is a link that opens it in Figma. Text only: nothing from the file is read as HTML.
  let bundle;
  const out = document.getElementById("out");
  const send = (msg) => parent.postMessage({ pluginMessage: msg }, "*");
  const run = (msg) => bundle && send({ bundle, ...msg });
  const el = (tag, text, cls) =>
    Object.assign(document.createElement(tag), {
      textContent: text,
      className: cls ?? "",
    });
  const show = (...nodes) => out.replaceChildren(...nodes);

  function itemOf({ text, node }) {
    const li = el("li");
    if (!node) li.textContent = text;
    else
      li.append(
        Object.assign(el("button", text, "link"), {
          onclick: () => send({ locate: node }),
        }),
      );
    return li;
  }
  function sectionOf({ title, items, decide }) {
    const details = Object.assign(el("details", "", decide ? "decide" : ""), {
      open: !!decide,
    });
    const list = el("ul");
    list.append(...items.map(itemOf));
    details.append(el("summary", `${title} (${items.length})`), list);
    return details;
  }

  document.getElementById("file").onchange = async (e) => {
    bundle = JSON.parse(await e.target.files[0].text());
    document.getElementById("apply").disabled = true; // a new file is previewed before it's applied
    run({}); // loading previews: reading changes nothing
  };
  document.getElementById("preview").onclick = () => run({});
  document.getElementById("apply").onclick = () => run({ apply: true });
  document.getElementById("pages").onclick = () => send({ pages: true });

  onmessage = ({ data: { pluginMessage: m } }) => {
    if (m.error) return show(el("p", `Error: ${m.error}`, "error"));
    const { headline, sections, applied } = m.report;
    if (applied !== undefined)
      document.getElementById("apply").disabled = applied;
    show(el("p", headline, "headline"), ...sections.map(sectionOf));
  };
</script>
